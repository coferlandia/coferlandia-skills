<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent-friendly log · dashboard en vivo</title>
<!--
  Dashboard en vivo para logs NDJSON agent-friendly.
  Proyección humana canónica: agent-friendly-logging/references/log-format-spec.md §6.
  Un solo archivo, sin build ni dependencias. SOLO LEE el log; no lo modifica.
  Replica en JS la lógica del parser canónico aflog.py (única copia JS, ligada al spec).
  Fuentes de datos:
    - URL (vista en vivo): ?src=URL_DEL_LOG  -> polling cada N s.
    - Drag & drop de un .ndjson (snapshot offline).
-->
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1d212c; --bd:#2a2f3a;
    --fg:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe;
    --info:#7f8a9c; --warn:#e0a106; --error:#e5484d; --ok:#39b56a; --bad:#e5484d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--bd);
         padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  header h1{font-size:15px;margin:0 12px 0 0;font-weight:600}
  header .grow{flex:1}
  input,select,button{background:var(--panel2);color:var(--fg);border:1px solid var(--bd);
        border-radius:6px;padding:6px 9px;font:inherit}
  input[type=text]{min-width:240px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  label.tog{display:flex;gap:6px;align-items:center;color:var(--muted);user-select:none}
  #status{color:var(--muted);font-size:12px}
  #status.err{color:var(--error)}
  main{padding:16px;max-width:1100px;margin:0 auto}
  .drop{display:none;border:2px dashed var(--accent);border-radius:12px;padding:40px;
        text-align:center;color:var(--muted);margin:16px}
  body.dragging .drop{display:block}
  .run{background:var(--panel);border:1px solid var(--bd);border-radius:12px;margin:0 0 18px;
       overflow:hidden}
  .run.bad{border-color:#5a2a2e}
  .run > .head{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;gap:10px;
       align-items:baseline;flex-wrap:wrap}
  .run .sys{font-weight:600;font-size:15px}
  .run .rid{color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .run .depth{color:var(--muted);font-size:12px}
  .badge{margin-left:auto;font-weight:600;padding:2px 10px;border-radius:999px;font-size:12px}
  .badge.ok{background:rgba(57,181,106,.15);color:var(--ok)}
  .badge.bad{background:rgba(229,72,77,.15);color:var(--bad)}
  .body{padding:12px 16px}
  .ctx{color:var(--muted);margin:0 0 10px}
  .ctx b{color:var(--fg);font-weight:600}
  .states{margin:8px 0;font-size:13px}
  .states .s{display:inline-block;background:var(--panel2);border:1px solid var(--bd);
       border-radius:6px;padding:2px 8px;margin:2px}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
  th,td{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:var(--muted);font-weight:600}
  td.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  td.empty{background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(229,72,77,.06) 5px,rgba(229,72,77,.06) 10px)}
  .alerts{margin:8px 0}
  .alert{padding:4px 8px;border-radius:6px;margin:3px 0;font-size:13px}
  .alert.warn{background:rgba(224,161,6,.12);border-left:3px solid var(--warn)}
  .alert.error{background:rgba(229,72,77,.12);border-left:3px solid var(--error)}
  .outcome{margin-top:10px;font-size:14px}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--accent);font-size:13px}
  tr.lvl-warn td{background:rgba(224,161,6,.06)}
  tr.lvl-error td,tr.lvl-critical td{background:rgba(229,72,77,.08)}
  tr.mismatch td{background:rgba(229,72,77,.12)}
  .mk{text-align:center;width:28px}
  .vars td:first-child{color:var(--accent)}
  .empty-state{color:var(--muted);text-align:center;padding:60px 20px}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>🛰️ Log en vivo</h1>
  <input type="text" id="src" placeholder="URL del log .ndjson (opcional)">
  <label class="tog"><input type="checkbox" id="live"> en vivo</label>
  <select id="interval" title="Intervalo de refresco">
    <option value="2000">2s</option><option value="5000" selected>5s</option>
    <option value="10000">10s</option><option value="30000">30s</option>
  </select>
  <button id="reload">Recargar</button>
  <button id="pick">Cargar archivo…</button>
  <input type="file" id="file" accept=".ndjson,.jsonl,.log,.txt" style="display:none">
  <span class="grow"></span>
  <select id="fRun" title="Filtrar corrida"><option value="">todas las corridas</option></select>
  <select id="fLevel" title="Nivel mínimo">
    <option value="">todos los niveles</option>
    <option value="warn">warn+</option><option value="error">error+</option>
  </select>
  <span id="status">sin datos</span>
</header>

<div class="drop">Soltá un archivo <code>.ndjson</code> aquí</div>
<main id="out"><div class="empty-state">Cargá un archivo o indicá una URL de log para empezar.</div></main>

<script>
"use strict";
const ERROR_LEVELS=new Set(["error","critical"]);
const WARN_LEVELS=new Set(["warn","warning"]);
const ALERT_TYPES=new Set(["warning","anomaly"]);
const LEVEL_ORDER={debug:0,info:1,warn:2,warning:2,error:3,critical:4};
const $=s=>document.querySelector(s);
let RECORDS=[];

function esc(v){if(v==null)return"";return String(v)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shortTime(ts){if(!ts||!String(ts).includes("T"))return esc(ts);
  return esc(String(ts).split("T")[1].replace("Z","").split("+")[0]);}

function parseNDJSON(text){
  const recs=[],warns=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    line=line.trim(); if(!line)return;
    try{recs.push(JSON.parse(line));}catch(e){warns.push("línea "+(i+1)+": JSON inválido");}
  });
  return {recs,warns};
}

function eventMarker(e){
  const lvl=(e.level||"").toLowerCase(), et=(e.event_type||"").toLowerCase();
  if(ERROR_LEVELS.has(lvl))return"🔴";
  if(WARN_LEVELS.has(lvl)||ALERT_TYPES.has(et))return"⚠";
  return"";
}
function groupRuns(recs){
  const headers=recs.filter(r=>r.rec==="header");
  const events=recs.filter(r=>r.rec==="event"&&r.event_type!=="header");
  const byRun={}; headers.forEach(h=>{if(h.run_id)byRun[h.run_id]=h;});
  const base=headers.length?headers[headers.length-1]:{};
  const runs={};
  events.forEach(e=>{(runs[e.run_id||"unknown"]??=[]).push(e);});
  const out=Object.entries(runs).map(([rid,evs])=>{
    const sorted=evs.slice().sort((a,b)=>(a.seq||0)-(b.seq||0)||String(a.ts).localeCompare(String(b.ts)));
    const hdr=byRun[rid]||base;
    const ev=sorted.find(e=>e.parent_run_id!=null);
    const parent=(ev&&ev.parent_run_id)||((hdr.correlation||{}).parent_run_id)||null;
    return {run_id:rid,events:sorted,header:hdr,parent_run_id:parent};
  });
  out.forEach(r=>{r.children=out.filter(c=>c.parent_run_id===r.run_id).map(c=>c.run_id);});
  return out;
}
function outcomeOf(events){
  let expected=null,actual=null,cause=null,objective=null;
  for(const e of events){
    if(e.event_type==="run_start"&&e.objective!=null)objective=e.objective;
    if(e.result&&typeof e.result==="object"){
      if("expected"in e.result)expected=e.result.expected;
      if("actual"in e.result)actual=e.result.actual;
    }
    if(e.event_type==="run_end"){if(e.cause!=null)cause=e.cause;}
  }
  const mismatch=expected!=null&&actual!=null&&expected!==actual;
  return {expected,actual,cause,objective,mismatch};
}
function statePath(events){
  const p=[];
  for(const e of events){
    if(["state_change","phase","run_start","run_end"].includes(e.event_type)){
      const s=e.to_state||e.state;
      if(s&&(p.length===0||p[p.length-1]!==s))p.push(s);
    }
  }
  return p;
}
function datosClave(e){
  const et=e.event_type;
  if(et==="decision")return esc(e.reason?`${e.decision} ← ${e.reason}`:e.decision);
  if(et==="state_change")return esc(`${e.from_state} → ${e.to_state}`+(e.reason?` (${e.reason})`:""));
  if(et==="external_call"){const x=e.external||{};return esc(`${x.service}/${x.op} ${x.status||""} ${x.latency_ms||""}ms`.trim());}
  if(et==="retry"||et==="recovery")return esc(`intento ${e.attempt}/${e.max_attempts||"?"} ${e.reason||""}`.trim());
  if(et==="anomaly")return esc(`esperado ${e.expected} / real ${e.actual}`);
  if(et==="result"||et==="run_end"){const r=e.result||{};return esc(`esperado ${r.expected} / real ${r.actual}`+(e.cause?` · ${e.cause}`:""));}
  if(et==="run_start")return esc("obj: "+(e.objective||""));
  return esc(e.data?JSON.stringify(e.data):"");
}

function renderRun(run,minLevel){
  const evs=run.events, hdr=run.header||{}, oc=outcomeOf(evs);
  const cls=oc.mismatch?"run bad":"run";
  const badge=oc.mismatch?'<span class="badge bad">❌ no confirmada</span>'
                         :'<span class="badge ok">✅ ok</span>';
  let h=`<div class="${cls}"><div class="head">
    <span class="sys">${esc(hdr.system||"sistema")}</span>
    <span class="rid">${esc(run.run_id)}</span>
    <span class="depth">depth=${esc(hdr.depth||"?")}</span>${badge}</div><div class="body">`;
  if(run.parent_run_id||(run.children&&run.children.length)){
    let n="";
    if(run.parent_run_id)n+=`↳ sub-corrida de <span class="rid">${esc(run.parent_run_id)}</span> `;
    if(run.children&&run.children.length)n+=`· sub-corridas: `+run.children.map(c=>`<span class="rid">${esc(c)}</span>`).join(", ");
    h+=`<p class="ctx">${n}</p>`;
  }
  h+=`<p class="ctx"><b>Objetivo:</b> ${esc(oc.objective||hdr.objective||"")} ·
      <b>Scope:</b> ${esc(hdr.scope||"")}</p>`;

  const vars=hdr.variables||{};
  if(Object.keys(vars).length){
    h+=`<table class="vars"><tr><th>variable</th><th>significado</th><th>unidad</th><th>valores</th></tr>`;
    for(const [n,m0] of Object.entries(vars)){const m=m0||{};
      const vals=m.values?m.values.join(" · "):(m.range||"");
      h+=`<tr><td class="mono">${esc(n)}</td><td>${esc(m.meaning)}</td>
          <td>${esc(m.unit||"—")}</td><td>${esc(vals)}</td></tr>`;}
    h+=`</table>`;
  }
  const sp=statePath(evs);
  if(sp.length)h+=`<div class="states">${sp.map(s=>`<span class="s">${esc(s)}</span>`).join("<span> → </span>")}</div>`;

  const decisions=evs.filter(e=>e.event_type==="decision");
  if(decisions.length){
    h+=`<table><tr><th>seq</th><th>decisión</th><th>porqué (reason)</th></tr>`;
    for(const e of decisions){
      const empty=e.reason?"":' class="empty"';
      h+=`<tr><td>${esc(e.seq)}</td><td class="mono">${esc(e.decision)}</td><td${empty}>${esc(e.reason)}</td></tr>`;}
    h+=`</table>`;
  }
  const alerts=evs.filter(e=>eventMarker(e));
  if(alerts.length){
    h+=`<div class="alerts">`;
    for(const e of alerts){
      const isErr=ERROR_LEVELS.has((e.level||"").toLowerCase());
      h+=`<div class="alert ${isErr?"error":"warn"}">${eventMarker(e)} seq ${esc(e.seq)} ·
          ${esc(e.event_type)} ${esc(e.component)} — ${datosClave(e)}</div>`;}
    h+=`</div>`;
  }
  if(oc.expected!=null||oc.actual!=null){
    h+=`<p class="outcome"><b>Desenlace:</b> esperado <code>${esc(oc.expected)}</code> /
        real <code>${esc(oc.actual)}</code>${oc.cause?` — causa: ${esc(oc.cause)}`:""}</p>`;
  }

  // Timeline (colapsable)
  const min=minLevel?LEVEL_ORDER[minLevel]:-1;
  const rows=evs.filter(e=>min<0||(LEVEL_ORDER[(e.level||"info").toLowerCase()]??1)>=min);
  h+=`<details><summary>Timeline (${rows.length} eventos)</summary>
    <table><tr><th class="mk"></th><th>seq</th><th>hora</th><th>nivel</th><th>componente</th>
    <th>tipo</th><th>mensaje</th><th>datos</th></tr>`;
  for(const e of rows){
    let mk=eventMarker(e); if(!mk&&outcomeOf([e]).mismatch)mk="❌";
    const lvl=(e.level||"").toLowerCase();
    const rowcls=(mk==="❌"?"mismatch":("lvl-"+lvl));
    h+=`<tr class="${rowcls}"><td class="mk">${mk}</td><td>${esc(e.seq)}</td>
        <td class="mono">${shortTime(e.ts)}</td><td>${esc(e.level)}</td>
        <td>${esc(e.component)}</td><td>${esc(e.event_type)}</td>
        <td>${esc(e.msg)}</td><td>${datosClave(e)}</td></tr>`;}
  h+=`</table></details></div></div>`;
  return h;
}

function render(){
  const runs=groupRuns(RECORDS);
  const fRun=$("#fRun").value, fLevel=$("#fLevel").value;
  const cur=$("#fRun").value;
  $("#fRun").innerHTML='<option value="">todas las corridas</option>'+
    runs.map(r=>`<option value="${esc(r.run_id)}">${esc(r.run_id)}</option>`).join("");
  $("#fRun").value=cur;
  const shown=runs.filter(r=>!fRun||r.run_id===fRun);
  const out=$("#out");
  if(!RECORDS.length){out.innerHTML='<div class="empty-state">Sin registros válidos en la fuente.</div>';return;}
  if(!shown.length){out.innerHTML='<div class="empty-state">No hay corridas para el filtro actual.</div>';return;}
  out.innerHTML=shown.map(r=>renderRun(r,fLevel)).join("");
}

function setStatus(msg,err){const s=$("#status");s.textContent=msg;s.className=err?"err":"";}

async function loadFromURL(url){
  try{
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok){setStatus("HTTP "+res.status,true);return;}
    const text=await res.text();
    const {recs,warns}=parseNDJSON(text);
    RECORDS=recs; render();
    setStatus(`${recs.length} registros · ${new Date().toLocaleTimeString()}`+(warns.length?` · ${warns.length} líneas omitidas`:""));
  }catch(e){setStatus("error de red: "+e.message,true);}
}
function loadFromText(text,name){
  const {recs,warns}=parseNDJSON(text);
  RECORDS=recs; render();
  setStatus(`${name}: ${recs.length} registros`+(warns.length?` · ${warns.length} omitidas`:""));
}

// ---- polling en vivo ----
let timer=null;
function tick(){const url=$("#src").value.trim();if(url)loadFromURL(url);}
function syncLive(){
  clearInterval(timer);
  if($("#live").checked&&$("#src").value.trim()){
    timer=setInterval(tick,parseInt($("#interval").value,10));
    tick();
  }
}

// ---- eventos UI ----
$("#reload").onclick=()=>{const u=$("#src").value.trim();if(u)loadFromURL(u);else render();};
$("#live").onchange=syncLive;
$("#interval").onchange=syncLive;
$("#src").onchange=()=>{if($("#src").value.trim())loadFromURL($("#src").value.trim());};
$("#fRun").onchange=render; $("#fLevel").onchange=render;
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>loadFromText(r.result,f.name);r.readAsText(f);};

// drag & drop
document.addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("dragging");});
document.addEventListener("dragleave",e=>{if(e.relatedTarget===null)document.body.classList.remove("dragging");});
document.addEventListener("drop",e=>{e.preventDefault();document.body.classList.remove("dragging");
  const f=e.dataTransfer.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>loadFromText(r.result,f.name);r.readAsText(f);});

// auto-cargar si viene ?src= en la URL
const params=new URLSearchParams(location.search);
if(params.get("src")){$("#src").value=params.get("src");$("#live").checked=true;syncLive();}
</script>
</body>
</html>
