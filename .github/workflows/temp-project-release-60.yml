name: Temporary Release Projection 60

on:
  push:
    branches:
      - fix/60-release-draft-resume

permissions:
  contents: write

jobs:
  project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/60-release-draft-resume
          fetch-depth: 0
      - name: Project release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notes = Path('RELEASE-NOTES.md')
          text = notes.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          section = '''## v2.10.2 (2026-09-12)\n\n### Skills\n\n| Skill | Previous | Current | Summary |\n|---|---:|---:|---|\n| coferlandia-release-publisher | 1.1.2 | 1.1.3 | Fixes draft release discovery so publication can safely resume from an existing annotated tag plus matching draft when GitHub omits drafts from the release-by-tag endpoint. |\n\n### Plugin and packaging\n\n- Bumps the repository/plugin from v2.10.1 to v2.10.2 for the compatible release-publisher recovery fix.\n- Corrects the publisher compatibility contract to require GitHub token authorization rather than a preinstalled GitHub CLI.\n\n### Migration or compatibility\n\n- Compatible patch: existing release policies, tags and matching draft Releases remain valid; partial `TAG + DRAFT` state resumes without recreating or moving release identity.\n\n'''
          if '## v2.10.2 (2026-09-12)' not in text:
              if marker not in text:
                  raise SystemExit('release notes Unreleased marker not found')
              text = text.replace(marker, marker + section, 1)
              notes.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '**v2.10.1 — 2026-09-12**'
          new = '**v2.10.2 — 2026-09-12**'
          if old in text:
              text = text.replace(old, new, 1)
              readme.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('README latest release marker not found')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-NOTES.md README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(release): project v2.10.2 (#60)"
          git push origin HEAD:fix/60-release-draft-resume
