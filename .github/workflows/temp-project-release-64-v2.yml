name: Temporary Release Projection 64 v2

on:
  push:
    branches:
      - fix/64-publication-control-plane

permissions:
  contents: write

jobs:
  project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/64-publication-control-plane
          fetch-depth: 0
      - name: Project v2.10.4 metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plugin = Path('.claude-plugin/plugin.json')
          data = json.loads(plugin.read_text(encoding='utf-8'))
          if data.get('version') != '2.10.3':
              raise SystemExit(f"unexpected plugin version: {data.get('version')}")
          data['version'] = '2.10.4'
          plugin.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          notes = Path('RELEASE-NOTES.md')
          text = notes.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          section = '''## v2.10.4 (2026-09-12)\n\n### Skills\n\n| Skill | Previous | Current | Summary |\n|---|---:|---:|---|\n| coferlandia-ci-adapter | 1.2.1 | 1.2.2 | Separates the publication control-plane checkout from the immutable release target so current publisher fixes can recover an older partial release without changing release identity. |\n\n### Plugin and packaging\n\n- Bumps the repository/plugin from v2.10.3 to v2.10.4 for the compatible publication recovery transport fix.\n\n### Migration or compatibility\n\n- Existing `publication.github` policy, request schema, runner declarations and exact release-target identity remain compatible.\n- Generated publication workflows now execute control-plane code from the exact default-branch workflow revision while all release Git operations remain bound to the requested historical target SHA.\n\n'''
          if '## v2.10.4 (2026-09-12)' not in text:
              if marker not in text:
                  raise SystemExit('Unreleased marker not found')
              notes.write_text(text.replace(marker, marker + section, 1), encoding='utf-8')
          PY

          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py render-readme --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json RELEASE-NOTES.md README.md
          git commit -m "chore(release): project v2.10.4 (#64)"
          git push origin HEAD:fix/64-publication-control-plane
