name: Temporary release prepare 56

on:
  push:
    branches:
      - fix/56-release-workflow-no-gh

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/56-release-workflow-no-gh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare canonical 2.10.1 release projections
        shell: bash
        run: |
          mkdir -p .agent
          cat > .agent/release-plan.json <<'JSON'
          {
            "schema_version": 1,
            "release_version": "2.10.1",
            "release_date": "2026-09-12",
            "impact": "patch",
            "skills": [
              {
                "name": "coferlandia-ci-adapter",
                "previous_version": "1.2.0",
                "new_version": "1.2.1",
                "summary": "Removes the generated GitHub-native publication workflow dependency on a preinstalled GitHub CLI by using Python standard-library GitHub REST calls while preserving runner, authority and exact-SHA controls."
              },
              {
                "name": "coferlandia-release-publisher",
                "previous_version": "1.1.1",
                "new_version": "1.1.2",
                "summary": "Replaces GitHub CLI subprocess calls with a Python standard-library GitHub REST transport using GITHUB_TOKEN or GH_TOKEN without changing fail-closed release semantics."
              }
            ],
            "plugin_changes": [
              "Publication no longer requires GitHub CLI on the selected runner; Python 3.11+ and GitHub token authorization are sufficient."
            ],
            "migration_notes": [
              "Compatible patch: existing repository publication policies and runner declarations remain valid."
            ]
          }
          JSON
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py prepare --input .agent/release-plan.json
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py check --base 025ba0543340244f9c53b610ebcd871483ecbc7f --release-ready
      - name: Commit canonical projections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json RELEASE-NOTES.md README.md skills/meta/coferlandia-ci-adapter/SKILL.md skills/meta/coferlandia-ci-adapter/CHANGELOG.md skills/ops/coferlandia-release-publisher/SKILL.md skills/ops/coferlandia-release-publisher/CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(release): project Coferlandia 2.10.1 (#56)"
          git push origin HEAD:fix/56-release-workflow-no-gh
