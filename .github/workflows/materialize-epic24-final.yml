name: Materialize Epic 24 final

on:
  push:
    branches: [epic-24-config-tooling]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: epic-24-config-tooling

      - name: Verify and extract reviewed payload
        shell: python
        run: |
          import base64
          import glob
          import hashlib
          import lzma
          import pathlib
          import tarfile

          paths = sorted(glob.glob('.agent/epic24.valid.*'))
          expected_names = [
              '.agent/epic24.valid.00',
              '.agent/epic24.valid.01',
              '.agent/epic24.valid.02',
              '.agent/epic24.valid.03',
              '.agent/epic24.valid.04a',
              '.agent/epic24.valid.05',
              '.agent/epic24.valid.06',
          ]
          if paths != expected_names:
              raise SystemExit(f'unexpected payload files: {paths}')
          encoded = ''.join(pathlib.Path(path).read_text(encoding='utf-8') for path in paths)
          lengths = {path: pathlib.Path(path).stat().st_size for path in paths}
          print({'lengths': lengths, 'total': len(encoded)})
          if len(encoded) != 65328:
              raise SystemExit(f'payload length mismatch: {len(encoded)}')
          digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if digest != 'f00704a389ccf8b290d13165557960a12651a28ecdb13ea1265eb80f958f4447':
              raise SystemExit(f'payload SHA-256 mismatch: {digest}')
          data = base64.b64decode(encoded, validate=True)
          if len(data) != 48996 or not data.startswith(b'\xfd7zXZ\x00'):
              raise SystemExit(f'invalid archive payload: bytes={len(data)}')
          lzma.decompress(data)
          archive_path = pathlib.Path('/tmp/epic24.tar.xz')
          archive_path.write_bytes(data)
          with tarfile.open(archive_path, 'r:xz') as archive:
              names = set(archive.getnames())
              required = {
                  'skills/meta/coferlandia-config-toolsmith/SKILL.md',
                  'skills/ops/coferlandia-config-devops/SKILL.md',
              }
              missing = required - names
              if missing:
                  raise SystemExit(f'payload missing required files: {sorted(missing)}')
              archive.extractall('.', filter='data')

      - name: Integrate inventory and CI
        shell: python
        run: |
          from pathlib import Path

          index = Path('skills/INDEX.md')
          text = index.read_text(encoding='utf-8')
          meta_anchor = '| [coferlandia-skill-toolsmith](./meta/coferlandia-skill-toolsmith/) | Explicit-invocation-only skill that analyzes a target skill, consolidates its deterministic behavior behind one unified Python CLI (scripts/<name>-cli.py), and rewires the skill to use it | active |\n'
          meta_row = '| [coferlandia-config-toolsmith](./meta/coferlandia-config-toolsmith/) | Explicitly builds a standardized, agent-operable configuration CLI and static contract over a project’s existing native configuration system without creating a shadow store | active |\n'
          if meta_row not in text:
              if meta_anchor not in text:
                  raise SystemExit('meta index anchor missing')
              text = text.replace(meta_anchor, meta_anchor + meta_row)
          ops_anchor = '| [project-orchestrator](./ops/project-orchestrator/) | Execute direct plans or Analyst DAGs after one-time GitHub/filesystem initialization, using a frozen local snapshot, immutable reviews, final PR traceability, and explicit integration | active |\n'
          ops_row = '| [coferlandia-config-devops](./ops/coferlandia-config-devops/) | Operate a Toolsmith-prepared configuration facade from natural-language intent in direct Execute Mode or control-tower Guide Mode | active |\n'
          if ops_row not in text:
              if ops_anchor not in text:
                  raise SystemExit('ops index anchor missing')
              text = text.replace(ops_anchor, ops_anchor + ops_row)
          text = text.replace('*Last updated: 2026-08-01*', '*Last updated: 2026-08-03*')
          index.write_text(text, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          anchor = '      - name: Validate all public skills\n        run: python _protocol/scripts/validate_skill.py --all skills\n'
          addition = '''      - name: Config Toolsmith tests\n        run: python -m unittest discover -s skills/meta/coferlandia-config-toolsmith/tests -p "test_*.py"\n\n      - name: Config DevOps tests\n        run: python -m unittest discover -s skills/ops/coferlandia-config-devops/tests -p "test_*.py"\n\n'''
          if 'Config Toolsmith tests' not in ci_text:
              if anchor not in ci_text:
                  raise SystemExit('CI insertion anchor missing')
              ci_text = ci_text.replace(anchor, addition + anchor)
          ci.write_text(ci_text, encoding='utf-8')

      - name: Remove transport artifacts
        shell: bash
        run: |
          find skills/meta/coferlandia-config-toolsmith skills/ops/coferlandia-config-devops -type d -name __pycache__ -prune -exec rm -rf {} +
          find skills/meta/coferlandia-config-toolsmith skills/ops/coferlandia-config-devops -type f -name '*.pyc' -delete
          rm -f .agent/epic24.valid.*
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/materialize-epic24-final.yml

      - name: Validate implementation
        shell: bash
        run: |
          python -m unittest discover -s skills/meta/coferlandia-config-toolsmith/tests -p 'test_*.py'
          python -m unittest discover -s skills/ops/coferlandia-config-devops/tests -p 'test_*.py'
          python _protocol/scripts/validate_skill.py skills/meta/coferlandia-config-toolsmith
          python _protocol/scripts/validate_skill.py skills/ops/coferlandia-config-devops

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'coferlandia-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'skill: add agent-operable configuration tooling'
          git push origin HEAD:epic-24-config-tooling
