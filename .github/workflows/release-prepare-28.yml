name: Issue 28 Release Preparation

on:
  push:
    branches:
      - agent/28-exact-ci-merge-gate
    paths:
      - .agent/release-plan-28.json
      - .github/workflows/release-prepare-28.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/28-exact-ci-merge-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare release surfaces
        run: python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py prepare --input .agent/release-plan-28.json
      - name: Commit generated release surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json skills/ops/project-orchestrator/SKILL.md skills/ops/project-orchestrator/CHANGELOG.md RELEASE-NOTES.md README.md
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          git commit -m "release: prepare Coferlandia skills v2.4.0"
          git push origin HEAD:agent/28-exact-ci-merge-gate
