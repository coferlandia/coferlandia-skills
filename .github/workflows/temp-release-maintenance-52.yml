name: Temporary Release Maintenance 52

on:
  push:
    branches:
      - fix/52-publication-runner-config

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/52-publication-runner-config
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent
          cat > .agent/release-plan.json <<'JSON'
          {
            "schema_version": 1,
            "release_version": "2.9.1",
            "release_date": "2026-09-12",
            "impact": "patch",
            "skills": [
              {
                "name": "coferlandia-ci-adapter",
                "previous_version": "1.1.0",
                "new_version": "1.1.1",
                "impact": "patch",
                "summary": "Makes the GitHub-native publication runner repository-configurable while preserving ubuntu-latest as the compatible default and keeping publication separate from Qualification."
              },
              {
                "name": "coferlandia-release-publisher",
                "previous_version": "1.1",
                "new_version": "1.1.1",
                "impact": "patch",
                "summary": "Accepts and validates repository publication runner metadata without changing exact Commit-to-Release semantics."
              }
            ],
            "repository_changes": [
              "Adds optional publication.github.runs_on so repositories can explicitly select GitHub-hosted or self-hosted publication runners without coupling runner choice to .coferlandia/ci/profile.json.",
              "Adds deterministic self-hosted multi-label runner rendering and regression coverage after the SecretarIA publication transport exposed the hardcoded ubuntu-latest assumption."
            ],
            "plugin_changes": [
              "Bumps the plugin from v2.9.0 to v2.9.1 for the compatible publication-runner hotfix."
            ],
            "migration_notes": [
              "Existing publication policies without runs_on remain compatible and continue to default to ubuntu-latest; repositories requiring self-hosted publication must declare their exact runner labels during adaptation."
            ]
          }
          JSON
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py prepare --input .agent/release-plan.json
          rm -rf .agent
      - name: Commit generated release projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE-NOTES.md README.md .claude-plugin/plugin.json \
            skills/meta/coferlandia-ci-adapter/SKILL.md \
            skills/meta/coferlandia-ci-adapter/CHANGELOG.md \
            skills/ops/coferlandia-release-publisher/SKILL.md \
            skills/ops/coferlandia-release-publisher/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Release metadata already synchronized."
            exit 0
          fi
          git commit -m "chore(release): synchronize 2.9.1 metadata (#52)"
          git push origin HEAD:fix/52-publication-runner-config
