name: Temporary Harden 66

on:
  push:
    branches:
      - fix/66-release-publication-retry

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/66-release-publication-retry
          fetch-depth: 0

      - name: Harden retry selection and publisher verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Harden the generated retry resolver.
          p = Path('skills/meta/coferlandia-ci-adapter/scripts/coferlandia_ci_adapter_cli/publication.py')
          s = p.read_text(encoding='utf-8')
          step = s.index('      - name: Parse immutable publication request')
          imp = "          from urllib.request import Request, urlopen\n"
          imp_at = s.index(imp, step)
          s = s[:imp_at] + "          from urllib.error import HTTPError\n          from urllib.parse import quote\n" + imp + s[imp_at + len(imp):]

          start = s.index("          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))\n", step)
          end = s.index("          request_path = Path(os.environ['RUNNER_TEMP']) / 'coferlandia-publication-request.json'\n", start)
          replacement = '''          def parse_request(candidate_body):
              if not isinstance(candidate_body, str) or candidate_body.count(marker) != 1:
                  raise ValueError('publication request must contain exactly one marker')
              tail = candidate_body.split(marker, 1)[1]
              matches = re.findall(r'```json\\s*(.+?)\\s*```', tail, re.S)
              if len(matches) != 1:
                  raise ValueError('publication request must contain exactly one JSON block')
              try:
                  request = json.loads(matches[0])
              except json.JSONDecodeError as exc:
                  raise ValueError('publication request JSON is invalid') from exc
              expected = {{'schema', 'target_sha', 'version', 'impact', 'title', 'notes'}}
              if not isinstance(request, dict) or set(request) != expected or request.get('schema') != 1:
                  raise ValueError('invalid publication request schema')
              if not re.fullmatch(r'[0-9a-f]{{40}}', request['target_sha']):
                  raise ValueError('target_sha must be an exact 40-character lowercase SHA')
              if not re.fullmatch(r'[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?', request['version']):
                  raise ValueError('version must be explicit SemVer without tag prefix')
              if request['impact'] not in {{'patch', 'minor', 'major'}}:
                  raise ValueError('impact must be patch, minor, or major')
              if not isinstance(request['title'], str) or not request['title'].strip():
                  raise ValueError('title must be non-empty')
              if not isinstance(request['notes'], str) or not request['notes'].strip():
                  raise ValueError('notes must be non-empty')
              return request

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          body = event['comment']['body']
          request_comment_id = event['comment']['id']
          if body == retry_command:
              repo = os.environ['GITHUB_REPOSITORY']
              token = os.environ['GITHUB_TOKEN']
              issue_number = event['issue']['number']
              current_id = event['comment']['id']

              def api_json(url):
                  api_request = Request(url, headers={{
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {{token}}',
                      'User-Agent': 'coferlandia-release-publication',
                      'X-GitHub-Api-Version': '2022-11-28',
                  }})
                  with urlopen(api_request, timeout=30) as response:
                      return json.load(response)

              def permission_for(login):
                  url = f'https://api.github.com/repos/{{repo}}/collaborators/{{quote(login, safe="")}}/permission'
                  try:
                      value = api_json(url)
                  except HTTPError as exc:
                      if exc.code in {{403, 404}}:
                          return None
                      raise
                  return value.get('permission')

              comments = []
              page = 1
              while True:
                  page_items = api_json(f'https://api.github.com/repos/{{repo}}/issues/{{issue_number}}/comments?per_page=100&page={{page}}')
                  if not isinstance(page_items, list):
                      raise SystemExit('GitHub issue comments response must be a list')
                  comments.extend(page_items)
                  if len(page_items) < 100:
                      break
                  page += 1

              request = None
              for comment in sorted(comments, key=lambda item: item.get('id', 0), reverse=True):
                  comment_id = comment.get('id', 0)
                  candidate_body = comment.get('body', '')
                  if comment_id >= current_id or marker not in candidate_body:
                      continue
                  author = (comment.get('user') or {{}}).get('login')
                  if not author or permission_for(author) not in {{'admin', 'maintain'}}:
                      continue
                  try:
                      candidate = parse_request(candidate_body)
                  except ValueError:
                      continue
                  request = candidate
                  request_comment_id = comment_id
                  break
              if request is None:
                  raise SystemExit('retry requested but no prior authorized valid publication request exists')
          else:
              try:
                  request = parse_request(body)
              except ValueError as exc:
                  raise SystemExit(str(exc)) from exc
'''
          s = s[:start] + replacement + s[end:]

          out_anchor = "              output.write(f\"version={{request['version']}}\\\\n\")\n"
          if out_anchor not in s:
              raise SystemExit('request output anchor not found')
          s = s.replace(out_anchor, out_anchor + "              output.write(f\"request_comment_id={{request_comment_id}}\\\\n\")\n", 1)
          p.write_text(s, encoding='utf-8')

          # Fail closed if GitHub ever exposes multiple release objects for the same tag.
          gh = Path('skills/ops/coferlandia-release-publisher/scripts/release_publisher/github_service.py')
          g = gh.read_text(encoding='utf-8')
          old = '''        return next((release for release in self.list_releases(repository) if release.get("tag") == tag), None)\n'''
          new = '''        matches = [release for release in self.list_releases(repository) if release.get("tag") == tag]\n        if len(matches) > 1:\n            raise ReleaseError(f"multiple GitHub Releases use tag {tag}")\n        return matches[0] if matches else None\n'''
          if old not in g:
              raise SystemExit('release_by_tag fallback anchor not found')
          g = g.replace(old, new, 1)

          old_download = '''    def download_text_asset(self, repository: str, asset_id: int) -> str:\n        owner, repo = self._split(repository)\n        raw = self._request_bytes(\n            "GET",\n            f"repos/{owner}/{repo}/releases/assets/{asset_id}",\n            accept="application/octet-stream",\n        )\n        if raw is None:\n            raise ReleaseError("GitHub asset download returned no response")\n        return raw.decode("utf-8")\n'''
          new_download = '''    def download_asset_bytes(self, repository: str, asset_id: int) -> bytes:\n        owner, repo = self._split(repository)\n        raw = self._request_bytes(\n            "GET",\n            f"repos/{owner}/{repo}/releases/assets/{asset_id}",\n            accept="application/octet-stream",\n        )\n        if raw is None:\n            raise ReleaseError("GitHub asset download returned no response")\n        return raw\n\n    def download_text_asset(self, repository: str, asset_id: int) -> str:\n        return self.download_asset_bytes(repository, asset_id).decode("utf-8")\n'''
          if old_download not in g:
              raise SystemExit('asset download anchor not found')
          g = g.replace(old_download, new_download, 1)
          gh.write_text(g, encoding='utf-8')

          # Verify asset digests by downloading bytes if the API omits digest metadata.
          op = Path('skills/ops/coferlandia-release-publisher/scripts/release_publisher/operations.py')
          o = op.read_text(encoding='utf-8')
          anchor = '''def _asset_digest(asset: dict[str, Any]) -> str | None:\n    digest = asset.get("sha256")\n    return digest if isinstance(digest, str) and len(digest) == 64 else None\n'''
          helper = anchor + '''\ndef _resolved_asset_digest(github: GitHubService, repository: str, asset: dict[str, Any]) -> str | None:\n    digest = _asset_digest(asset)\n    if digest:\n        return digest\n    asset_id = asset.get("id")\n    if not asset_id:\n        return None\n    return hashlib.sha256(github.download_asset_bytes(repository, int(asset_id))).hexdigest()\n'''
          if anchor not in o:
              raise SystemExit('asset digest anchor not found')
          o = o.replace(anchor, helper, 1)
          o = o.replace('_asset_digest(existing) != artifact["sha256"]', '_resolved_asset_digest(github, repository, existing) != artifact["sha256"]', 1)
          o = o.replace('_asset_digest(uploaded) != artifact["sha256"]', '_resolved_asset_digest(github, repository, uploaded) != artifact["sha256"]', 1)
          o = o.replace('_asset_digest(existing) != digest', '_resolved_asset_digest(github, plan.repository, existing) != digest', 1)
          o = o.replace('_asset_digest(uploaded) != digest', '_resolved_asset_digest(github, plan.repository, uploaded) != digest', 1)
          o = o.replace('def _verify_manifest_artifacts(release: dict[str, Any], manifest: dict[str, Any] | None) -> list[str]:', 'def _verify_manifest_artifacts(github: GitHubService, repository: str, release: dict[str, Any], manifest: dict[str, Any] | None) -> list[str]:', 1)
          o = o.replace('elif _asset_digest(asset) != expected:', 'elif _resolved_asset_digest(github, repository, asset) != expected:', 1)
          o = o.replace('elif _asset_digest(existing) != artifact["sha256"]:', 'elif _resolved_asset_digest(github, plan.repository, existing) != artifact["sha256"]:', 1)
          o = o.replace('errors.extend(_verify_manifest_artifacts(release, manifest))', 'errors.extend(_verify_manifest_artifacts(github, repository, release, manifest))', 1)
          op.write_text(o, encoding='utf-8')

          # Runtime regression test: execute the actual generated retry parser.
          runtime_test = Path('skills/meta/coferlandia-ci-adapter/tests/test_publication_retry_runtime.py')
          runtime_test.write_text(r'''from __future__ import annotations

import importlib.util
import json
import os
import tempfile
import textwrap
import unittest
from pathlib import Path

SKILL_ROOT = Path(__file__).resolve().parents[1]
MODULE = SKILL_ROOT / "scripts" / "coferlandia_ci_adapter_cli" / "publication.py"


def load_module():
    spec = importlib.util.spec_from_file_location("publication_module", MODULE)
    module = importlib.util.module_from_spec(spec)
    assert spec.loader is not None
    spec.loader.exec_module(module)
    return module


class FakeResponse:
    def __init__(self, value): self.value = value
    def __enter__(self): return self
    def __exit__(self, *args): return False
    def read(self): return json.dumps(self.value).encode("utf-8")


class RetryRuntimeTests(unittest.TestCase):
    def _script(self):
        workflow = load_module().render_workflow(
            publisher_path=".agents/skills/coferlandia-release-publisher/scripts/coferlandia-release.py"
        )
        section = workflow.split("      - name: Parse immutable publication request", 1)[1]
        script = section.split("          python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
        script = textwrap.dedent(script)
        return script.replace(
            "from urllib.request import Request, urlopen",
            "from urllib.request import Request\nurlopen = fake_urlopen",
        )

    def _request(self, title="Original"):
        payload = {
            "schema": 1,
            "target_sha": "a" * 40,
            "version": "1.0.0",
            "impact": "major",
            "title": title,
            "notes": "notes",
        }
        return "<!-- coferlandia-release-publication-request:v1 -->\n```json\n" + json.dumps(payload) + "\n```"

    def test_retry_skips_newer_malformed_and_unauthorized_requests(self):
        comments = [
            {"id": 100, "body": self._request("Authorized original"), "user": {"login": "good"}},
            {"id": 200, "body": self._request("Unauthorized override"), "user": {"login": "evil"}},
            {"id": 250, "body": "<!-- coferlandia-release-publication-request:v1 -->\n```json\n{bad}\n```", "user": {"login": "good"}},
        ]

        def fake_urlopen(request, timeout=30):
            url = request.full_url
            if "/issues/77/comments" in url:
                return FakeResponse(comments)
            if "/collaborators/good/permission" in url:
                return FakeResponse({"permission": "maintain"})
            if "/collaborators/evil/permission" in url:
                return FakeResponse({"permission": "read"})
            raise AssertionError(url)

        with tempfile.TemporaryDirectory() as temp:
            temp = Path(temp)
            event = {
                "issue": {"number": 77},
                "comment": {"id": 300, "body": "Retry the existing Coferlandia publication request."},
            }
            event_path = temp / "event.json"
            output_path = temp / "out.txt"
            event_path.write_text(json.dumps(event), encoding="utf-8")
            old = os.environ.copy()
            try:
                os.environ.update({
                    "GITHUB_EVENT_PATH": str(event_path),
                    "GITHUB_REPOSITORY": "coferlandia/demo",
                    "GITHUB_TOKEN": "token",
                    "GITHUB_OUTPUT": str(output_path),
                    "RUNNER_TEMP": str(temp),
                })
                exec(self._script(), {"fake_urlopen": fake_urlopen})
            finally:
                os.environ.clear(); os.environ.update(old)
            resolved = json.loads((temp / "coferlandia-publication-request.json").read_text(encoding="utf-8"))
            self.assertEqual(resolved["title"], "Authorized original")
            self.assertIn("request_comment_id=100", output_path.read_text(encoding="utf-8"))

    def test_retry_fails_when_no_prior_authorized_valid_request_exists(self):
        comments = [{"id": 100, "body": self._request("No authority"), "user": {"login": "evil"}}]
        def fake_urlopen(request, timeout=30):
            if "/issues/77/comments" in request.full_url:
                return FakeResponse(comments)
            if "/collaborators/evil/permission" in request.full_url:
                return FakeResponse({"permission": "read"})
            raise AssertionError(request.full_url)
        with tempfile.TemporaryDirectory() as temp:
            temp = Path(temp)
            event_path = temp / "event.json"
            event_path.write_text(json.dumps({"issue": {"number": 77}, "comment": {"id": 300, "body": "Retry the existing Coferlandia publication request."}}), encoding="utf-8")
            old = os.environ.copy()
            try:
                os.environ.update({"GITHUB_EVENT_PATH": str(event_path), "GITHUB_REPOSITORY": "coferlandia/demo", "GITHUB_TOKEN": "token", "GITHUB_OUTPUT": str(temp / "out.txt"), "RUNNER_TEMP": str(temp)})
                with self.assertRaisesRegex(SystemExit, "no prior authorized valid"):
                    exec(self._script(), {"fake_urlopen": fake_urlopen})
            finally:
                os.environ.clear(); os.environ.update(old)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          # HTTP regression for ambiguous draft identities.
          http_test = Path('skills/ops/coferlandia-release-publisher/tests/test_github_service_http.py')
          ht = http_test.read_text(encoding='utf-8')
          ht = ht.replace('from release_publisher.github_service import GitHubService\n', 'from release_publisher.github_service import GitHubService\nfrom release_publisher.model import ReleaseError\n', 1)
          insert = '''\n    def test_release_by_tag_rejects_ambiguous_draft_collection(self) -> None:\n        not_found = HTTPError(\n            "https://api.github.com/repos/coferlandia/demo/releases/tags/v1.2.0",\n            404, "Not Found", hdrs=None, fp=io.BytesIO(b"{}"),\n        )\n        opener = FakeOpener([\n            not_found,\n            [\n                {"id": 41, "tag_name": "v1.2.0", "name": "Draft A", "draft": True, "prerelease": False, "assets": []},\n                {"id": 42, "tag_name": "v1.2.0", "name": "Draft B", "draft": True, "prerelease": False, "assets": []},\n            ],\n        ])\n        service = GitHubService(opener=opener, token="")\n        with self.assertRaisesRegex(ReleaseError, "multiple GitHub Releases"):\n            service.release_by_tag("coferlandia/demo", "v1.2.0")\n'''
          marker = '    def test_create_release_posts_explicit_draft_payload(self) -> None:\n'
          if insert.strip() not in ht:
              ht = ht.replace(marker, insert + '\n' + marker, 1)
          http_test.write_text(ht, encoding='utf-8')

          # Publication regression when GitHub omits asset digest metadata.
          pub_test = Path('skills/ops/coferlandia-release-publisher/tests/test_publication.py')
          pt = pub_test.read_text(encoding='utf-8')
          extra = r'''

class NoDigestGitHub(StatefulGitHub):
    def upload_asset(self, repository, release_id, path: Path, name=None):
        asset = super().upload_asset(repository, release_id, path, name)
        stored = next(item for item in self.releases if item["id"] == release_id)["assets"][-1]
        asset.pop("sha256", None)
        stored.pop("sha256", None)
        return asset

    def download_asset_bytes(self, repository, asset_id):
        return self.contents[asset_id].encode("utf-8")


class AssetDigestFallbackTests(unittest.TestCase):
    def test_provenance_publish_succeeds_when_asset_digest_metadata_is_missing(self) -> None:
        with tempfile.TemporaryDirectory() as temp:
            root = Path(temp)
            git, github = StatefulGit(), NoDigestGitHub()
            policy = copy.deepcopy(DEFAULT_POLICY)
            inspection = inspect_release(root, "coferlandia/demo", "HEAD", policy, git=git, github=github)
            plan = build_plan(root, "coferlandia/demo", inspection, policy, impact="minor", version="1.0.0", title="Initial release", release_notes="Summary", provenance="optional", git=git, github=github)
            result = publish_release(root, plan, git=git, github=github)
            self.assertEqual(result["status"], "published")
            self.assertEqual(result["release"]["consistency"], "pass")
'''
          if 'class AssetDigestFallbackTests' not in pt:
              pt = pt.replace('\n\nif __name__ == "__main__":\n', extra + '\n\nif __name__ == "__main__":\n', 1)
          pub_test.write_text(pt, encoding='utf-8')
          PY

          python skills/meta/coferlandia-ci-adapter/tests/test_publication_no_gh.py
          python skills/meta/coferlandia-ci-adapter/tests/test_publication_retry_runtime.py
          python -m unittest discover -s skills/ops/coferlandia-release-publisher/tests -p 'test_*.py'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/meta/coferlandia-ci-adapter skills/ops/coferlandia-release-publisher
          git commit -m "fix(release): harden publication recovery flow (#66)"
          git push origin HEAD:fix/66-release-publication-retry
