name: Prepare Chat Coder release metadata

on:
  push:
    branches:
      - feature/69-chat-coder-gh-native-complete

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: run Chat Coder release preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/69-chat-coder-gh-native-complete

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Update delivery documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "README.md",
              '''```text
          Issue
            |
            v
          chat-coder (Chat Development)
            |
          READY_FOR_CI
            |
            +---------------------------+
            |                           |
            v                           v
          ci prompt                  local-ci skill
          GITHUB_NATIVE              LOCAL
            |                           |
            +--------- READY_FOR_MERGE -+
                         |
                         v
                      merge prompt
                         |
                      COMPLETE
          ```

          The development Qualification invocation surface determines the strategy: explicit Chat `ci` selects `GITHUB_NATIVE`, while invoking the `local-ci` Agent Skill selects `LOCAL`. `READY_FOR_CI` alone starts neither surface, and no separate strategy router is required.
          ''',
              '''```text
          Issue
            |
            v
          standalone chat coder
            |
            v
          chat-coder (Development)
            |
          READY_FOR_CI (internal durable handoff)
            |
            v
          ci (GITHUB_NATIVE Qualification)
            |
          READY_FOR_MERGE (internal durable handoff)
            |
            v
          merge (Integration + Issue closeout)
            |
          COMPLETE
          ```

          Standalone `chat coder` / `chat-coder` is the simple GitHub-native path: the prompt registry resolves Development -> `ci` -> `merge` before execution starts, so the user does not need separate CI and merge commands. The stages keep their existing authority boundaries and durable handoffs. Use `chat dev` / `chat-dev` to stop after Development at `READY_FOR_CI`, or compose explicitly (for example `chat coder + local ci + merge`) when another Qualification surface is intended. Explicit composition always overrides the standalone default, and no strategy silently falls back to another.
          ''',
          )

          replace_once(
              "SKILLS-GUIDE.md",
              "- For development Qualification, `local-ci` is `LOCAL`, while explicit Chat `ci` is `GITHUB_NATIVE`.",
              "- For development Qualification, `local-ci` is `LOCAL`, while resolved Chat `ci` is `GITHUB_NATIVE`; standalone `chat coder` resolves that GitHub-native stage through its declared default sequence.",
          )
          replace_once(
              "SKILLS-GUIDE.md",
              "| [`chat-coder`](./prompts/chat-coder.md) | Development is being driven from Chat. | Draft PR plus durable READY_FOR_CI. | Stops before Qualification. |",
              "| [`chat-coder`](./prompts/chat-coder.md) | Development is being driven from Chat. | Standalone `chat coder` completes Development -> GITHUB_NATIVE Qualification -> Integration; `chat dev` produces the Draft PR plus durable READY_FOR_CI only. | Stage authority remains separated; explicit `+` composition overrides the standalone default. |",
          )
          replace_once(
              "SKILLS-GUIDE.md",
              "Chat delivery:             chat-coder -> ci -> merge\nMixed local qualification: chat-coder -> local-ci -> merge",
              "Chat delivery:             chat coder (default -> chat-coder -> ci -> merge)\nMixed local qualification: chat coder + local ci + merge",
          )
          replace_once(
              "SKILLS-GUIDE.md",
              "Delivery composition is exact and left-to-right for ordinary development/release surfaces. The explicitly invoked `hotfix` controller is a bounded orchestration surface: it may call repository-approved owners as part of its emergency lifecycle, but it does not absorb or weaken their contracts. Missing stages are not inferred from ordinary work, and `LOCAL`/`GITHUB_NATIVE` strategies never silently fall back to one another. `READY_FOR_CI`, `READY_FOR_MERGE`, `READY_FOR_RELEASE`, and HOTFIX state are evidence, not permission to invent an undeclared next surface.",
              "Explicit `+` delivery composition is exact and left-to-right for ordinary development/release surfaces. A single standalone alias may expand only through a sequence declared in the prompt registry; standalone `chat coder` uses that mechanism for Development -> GITHUB_NATIVE Qualification -> Integration, while `chat dev` remains Development-only. The explicitly invoked `hotfix` controller is a bounded orchestration surface: it may call repository-approved owners as part of its emergency lifecycle, but it does not absorb or weaken their contracts. Missing stages are never inferred from READY state, and `LOCAL`/`GITHUB_NATIVE` strategies never silently fall back to one another. `READY_FOR_CI`, `READY_FOR_MERGE`, `READY_FOR_RELEASE`, and HOTFIX state are evidence, not permission to invent an undeclared next surface.",
          )

          replace_once(
              "AGENTS.md",
              "2. Resolve only aliases explicitly requested (`chat coder`, `ci`/`gh ci`, `merge`, `chat release`, `hotfix`, or external `local ci` / `local release`).\n3. Ordinary controller compositions execute left-to-right without inserting missing stages or changing Qualification strategy. `hotfix` is an explicit high-level emergency-remediation controller and must never be inferred from an ordinary bug report.",
              "2. Resolve only aliases explicitly requested (`chat coder`, `chat dev`, `ci`/`gh ci`, `merge`, `chat release`, `hotfix`, or external `local ci` / `local release`). A single standalone alias may expand only through `composition.standalone_defaults` declared in the registry.\n3. Explicit `+` controller compositions execute left-to-right exactly as written and suppress standalone defaults; do not infer missing stages from READY state or change Qualification strategy. `hotfix` is an explicit high-level emergency-remediation controller and must never be inferred from an ordinary bug report.",
          )
          PY

      - name: Prepare release metadata
        shell: bash
        run: |
          cat > .agent-release-plan.json <<'JSON'
          {
            "schema_version": 1,
            "release_version": "2.12.0",
            "release_date": "2026-09-13",
            "impact": "minor",
            "skills": [],
            "repository_changes": [
              "Makes standalone `chat coder` / `chat-coder` a registry-declared convenience flow that resolves Development -> GITHUB_NATIVE Qualification -> Integration before execution while preserving each stage's authority boundary and durable handoffs.",
              "Adds `chat dev` / `chat-dev` as the explicit Development-only alias for callers that intentionally want to stop at `READY_FOR_CI`.",
              "Extends prompt registry validation/resolution with fail-closed `standalone_defaults`; explicit `+` compositions suppress defaults, READY state never infers another stage, and LOCAL/GITHUB_NATIVE fallback remains prohibited.",
              "Adds `WAITING_CI` as a factual non-terminal GitHub Actions state and continues automatically to `merge` when the already-resolved sequence includes Integration.",
              "Aligns prompt distribution documentation with current packaging: public prompts ship with the plugin and may also be vendored under consumer prompt directories such as `.agents/prompts/`."
            ],
            "plugin_changes": [
              "Bumps the repository/plugin from v2.11.2 to v2.12.0 for the additive standalone Chat Coder delivery sequence, prompt resolver contract, and updated Chat prompt catalog."
            ],
            "migration_notes": [
              "Standalone `chat coder` now completes GitHub-native Qualification and Integration by default; use `chat dev` when the intended terminal state is `READY_FOR_CI`.",
              "Explicit composed flows remain exact and take precedence over standalone defaults, so `chat coder + local ci + merge` continues to select LOCAL Qualification with no hidden GitHub-native stage.",
              "Consumers that vendor Chat prompts should synchronize `BOOTSTRAP.md`, `registry.json`, `chat-coder.md`, `ci.md`, and `INDEX.md` together with the resolver semantics."
            ]
          }
          JSON
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py prepare --input .agent-release-plan.json
          rm .agent-release-plan.json

      - name: Commit prepared metadata and remove helper
        shell: bash
        run: |
          rm .github/workflows/prepare-69-chat-coder-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: synchronize Chat Coder delivery contract"
          git push origin HEAD:feature/69-chat-coder-gh-native-complete
