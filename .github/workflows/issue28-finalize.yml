name: Issue 28 Final Reconciliation

on:
  push:
    branches:
      - agent/28-exact-ci-merge-gate
    paths:
      - .agent/issue28-finalize.py
      - .github/workflows/issue28-finalize.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/28-exact-ci-merge-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .agent/issue28-finalize.py
      - run: python -m pip install jsonschema
      - name: Focused orchestrator validation
        run: python -m unittest discover -s skills/ops/project-orchestrator/tests -p 'test_*.py'
      - name: Validate public skill
        run: python _protocol/scripts/validate_skill.py skills/ops/project-orchestrator
      - name: Commit reconciled contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/ops/project-orchestrator
          if git diff --cached --quiet; then
            echo "No reconciliation changes"
            exit 0
          fi
          git commit -m "fix(orchestrator): complete exact-candidate merge gate contract"
          git push origin HEAD:agent/28-exact-ci-merge-gate
