name: Temporary Release Projection 64

on:
  push:
    branches:
      - fix/64-publication-control-plane

permissions:
  contents: write

jobs:
  project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/64-publication-control-plane
          fetch-depth: 0
      - name: Project patch release metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          skill = Path('skills/meta/coferlandia-ci-adapter/SKILL.md')
          text = skill.read_text(encoding='utf-8')
          text = text.replace('version: "1.2.1"', 'version: "1.2.2"', 1)
          text = text.replace('tested: "2026-09-12 - CI profile, remote Development validation, configurable publication runners, and opt-in GitHub-native release publication rendering covered by unittest."', 'tested: "2026-09-12 - CI profile, remote Development validation, configurable publication runners, isolated publication control-plane execution, and opt-in GitHub-native release publication rendering covered by unittest."', 1)
          skill.write_text(text, encoding='utf-8')

          changelog = Path('skills/meta/coferlandia-ci-adapter/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          section = '''## 1.2.2 — 2026-09-12\n\n### Fixed\n\n- Separates the exact publication control-plane checkout from the immutable release-target checkout, so a patched publisher can safely resume a historical partial release without moving its tag or changing the target commit.\n\n### Compatibility\n\n- Existing `publication.github` policy remains unchanged; generated workflows still bind publication to the merged release PR SHA and use the repository-declared runner labels.\n\n'''
          if not text.startswith('# Changelog — coferlandia-ci-adapter\n\n'):
              raise SystemExit('unexpected adapter changelog header')
          if '## 1.2.2 — 2026-09-12' not in text:
              text = text.replace('# Changelog — coferlandia-ci-adapter\n\n', '# Changelog — coferlandia-ci-adapter\n\n' + section, 1)
              changelog.write_text(text, encoding='utf-8')

          plugin = Path('.claude-plugin/plugin.json')
          data = json.loads(plugin.read_text(encoding='utf-8'))
          data['version'] = '2.10.3'
          plugin.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          notes = Path('RELEASE-NOTES.md')
          text = notes.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          section = '''## v2.10.3 (2026-09-12)\n\n### Skills\n\n| Skill | Previous | Current | Summary |\n|---|---:|---:|---|\n| coferlandia-ci-adapter | 1.2.1 | 1.2.2 | Separates the publication control-plane checkout from the immutable release target so current publisher fixes can recover an older partial release without changing release identity. |\n\n### Plugin and packaging\n\n- Bumps the repository/plugin from v2.10.2 to v2.10.3 for the compatible publication recovery transport fix.\n\n### Migration or compatibility\n\n- Compatible patch: existing release policy and publication request schema are unchanged.\n\n'''
          if '## v2.10.3 (2026-09-12)' not in text:
              text = text.replace(marker, marker + section, 1)
              notes.write_text(text, encoding='utf-8')
          PY

          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py render-readme --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/meta/coferlandia-ci-adapter/SKILL.md skills/meta/coferlandia-ci-adapter/CHANGELOG.md .claude-plugin/plugin.json RELEASE-NOTES.md README.md
          git commit -m "chore(release): project v2.10.3 (#64)"
          git push origin HEAD:fix/64-publication-control-plane
