name: Temporary Patch 66

on:
  push:
    branches:
      - fix/66-release-publication-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/66-release-publication-retry
          fetch-depth: 0
      - name: Apply publication retry patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('skills/meta/coferlandia-ci-adapter/scripts/coferlandia_ci_adapter_cli/publication.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'PUBLICATION_REQUEST_MARKER = "<!-- coferlandia-release-publication-request:v1 -->"\n',
              'PUBLICATION_REQUEST_MARKER = "<!-- coferlandia-release-publication-request:v1 -->"\nPUBLICATION_RETRY_COMMAND = "Retry the existing Coferlandia publication request."\n',
              1,
          )

          old_if = """      github.event.issue.pull_request &&\n      contains(github.event.comment.body, '{PUBLICATION_REQUEST_MARKER}')\n"""
          new_if = """      github.event.issue.pull_request &&\n      (contains(github.event.comment.body, '{PUBLICATION_REQUEST_MARKER}') ||\n       github.event.comment.body == '{PUBLICATION_RETRY_COMMAND}')\n"""
          if old_if not in s:
              raise SystemExit('publication job condition not found')
          s = s.replace(old_if, new_if, 1)

          parse_import = """          import re\n          from pathlib import Path\n\n          marker = {PUBLICATION_REQUEST_MARKER!r}\n"""
          parse_import_new = """          import re\n          from pathlib import Path\n          from urllib.request import Request, urlopen\n\n          marker = {PUBLICATION_REQUEST_MARKER!r}\n          retry_command = {PUBLICATION_RETRY_COMMAND!r}\n"""
          if parse_import not in s:
              raise SystemExit('parse import block not found')
          s = s.replace(parse_import, parse_import_new, 1)

          parse_old = """          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))\n          body = event['comment']['body']\n          if body.count(marker) != 1:\n              raise SystemExit('publication request must contain exactly one marker')\n          tail = body.split(marker, 1)[1]\n          matches = re.findall(r'```json\\\\s*(\\\\{{.*?\\\\}})\\\\s*```', tail, re.S)\n          if len(matches) != 1:\n              raise SystemExit('publication request must contain exactly one JSON block')\n          request = json.loads(matches[0])\n"""
          parse_new = """          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))\n          body = event['comment']['body']\n          if body.strip() == retry_command:\n              repo = os.environ['GITHUB_REPOSITORY']\n              token = os.environ['GITHUB_TOKEN']\n              issue_number = event['issue']['number']\n              current_id = event['comment']['id']\n              candidates = []\n              page = 1\n              while True:\n                  api_url = f'https://api.github.com/repos/{{repo}}/issues/{{issue_number}}/comments?per_page=100&page={{page}}'\n                  api_request = Request(api_url, headers={{\n                      'Accept': 'application/vnd.github+json',\n                      'Authorization': f'Bearer {{token}}',\n                      'User-Agent': 'coferlandia-release-publication',\n                      'X-GitHub-Api-Version': '2022-11-28',\n                  }})\n                  with urlopen(api_request, timeout=30) as response:\n                      comments = json.load(response)\n                  if not comments:\n                      break\n                  candidates.extend(\n                      comment for comment in comments\n                      if comment.get('id', 0) < current_id and marker in comment.get('body', '')\n                  )\n                  if len(comments) < 100:\n                      break\n                  page += 1\n              if not candidates:\n                  raise SystemExit('retry requested but no prior publication request exists')\n              body = max(candidates, key=lambda comment: comment['id'])['body']\n          if body.count(marker) != 1:\n              raise SystemExit('publication request must contain exactly one marker')\n          tail = body.split(marker, 1)[1]\n          matches = re.findall(r'```json\\\\s*(\\\\{{.*?\\\\}})\\\\s*```', tail, re.S)\n          if len(matches) != 1:\n              raise SystemExit('publication request must contain exactly one JSON block')\n          request = json.loads(matches[0])\n"""
          if parse_old not in s:
              raise SystemExit('parse request block not found')
          s = s.replace(parse_old, parse_new, 1)

          output_old = """          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:\n              output.write(f\"target_sha={{request['target_sha']}}\\\\n\")\n              output.write(f\"version={{request['version']}}\\\\n\")\n"""
          output_new = """          request_path = Path(os.environ['RUNNER_TEMP']) / 'coferlandia-publication-request.json'\n          request_path.write_text(json.dumps(request, sort_keys=True), encoding='utf-8')\n          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:\n              output.write(f\"target_sha={{request['target_sha']}}\\\\n\")\n              output.write(f\"version={{request['version']}}\\\\n\")\n"""
          if output_old not in s:
              raise SystemExit('request output block not found')
          s = s.replace(output_old, output_new, 1)

          materialize_old = """          marker = {PUBLICATION_REQUEST_MARKER!r}\n          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))\n          body = event['comment']['body']\n          if body.count(marker) != 1:\n              raise SystemExit('publication request must contain exactly one marker')\n          tail = body.split(marker, 1)[1]\n          matches = re.findall(r'```json\\\\s*(\\\\{{.*?\\\\}})\\\\s*```', tail, re.S)\n          if len(matches) != 1:\n              raise SystemExit('publication request must contain exactly one JSON block')\n          request = json.loads(matches[0])\n"""
          materialize_new = """          request_path = Path(os.environ['RUNNER_TEMP']) / 'coferlandia-publication-request.json'\n          request = json.loads(request_path.read_text(encoding='utf-8'))\n"""
          if materialize_old not in s:
              raise SystemExit('materialize request block not found')
          s = s.replace(materialize_old, materialize_new, 1)
          p.write_text(s, encoding='utf-8')

          test = Path('skills/meta/coferlandia-ci-adapter/tests/test_publication_no_gh.py')
          t = test.read_text(encoding='utf-8')
          anchor = '        self.assertNotIn("deploy", workflow.lower())\n'
          extra = '''        self.assertIn("Retry the existing Coferlandia publication request.", workflow)\n        self.assertIn("issues/{issue_number}/comments?per_page=100&page={page}", workflow)\n        self.assertIn("comment.get('id', 0) < current_id", workflow)\n        self.assertIn("retry requested but no prior publication request exists", workflow)\n        self.assertIn("coferlandia-publication-request.json", workflow)\n        self.assertNotIn("types: [created, edited]", workflow)\n'''
          if extra.strip() not in t:
              if anchor not in t:
                  raise SystemExit('test anchor not found')
              t = t.replace(anchor, anchor + extra, 1)
          test.write_text(t, encoding='utf-8')

          skill = Path('skills/meta/coferlandia-ci-adapter/SKILL.md')
          st = skill.read_text(encoding='utf-8')
          st = st.replace('version: "1.3.0"', 'version: "1.3.1"', 1)
          st = st.replace(
              'isolated publication control-plane execution, and opt-in GitHub-native release publication rendering covered by unittest.',
              'isolated publication control-plane execution, immutable request retry recovery, and opt-in GitHub-native release publication rendering covered by unittest.',
              1,
          )
          skill.write_text(st, encoding='utf-8')

          changelog = Path('skills/meta/coferlandia-ci-adapter/CHANGELOG.md')
          ct = changelog.read_text(encoding='utf-8')
          section = '''## 1.3.1 — 2026-09-12\n\n### Added\n\n- Adds an authorized text-only retry command for GitHub-native publication recovery. Retry resolves the latest prior immutable publication request from the same PR and replays it through the normal publisher path.\n\n### Safety\n\n- Retry comments cannot supply or override release payload fields; actor authorization, merged-PR binding, exact target SHA validation, isolated control-plane execution and fail-closed publisher semantics remain unchanged.\n\n'''
          if section not in ct:
              ct = ct.replace('# Changelog — coferlandia-ci-adapter\n\n', '# Changelog — coferlandia-ci-adapter\n\n' + section, 1)
          changelog.write_text(ct, encoding='utf-8')

          plugin = Path('.claude-plugin/plugin.json')
          import json
          data = json.loads(plugin.read_text(encoding='utf-8'))
          if data.get('version') != '2.11.0':
              raise SystemExit(f"unexpected plugin version: {data.get('version')}")
          data['version'] = '2.11.1'
          plugin.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          notes = Path('RELEASE-NOTES.md')
          nt = notes.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          release = '''## v2.11.1 (2026-09-12)\n\n### Skills\n\n| Skill | Previous | Current | Summary |\n|---|---:|---:|---|\n| coferlandia-ci-adapter | 1.3.0 | 1.3.1 | Adds safe replay of the latest prior immutable publication request through a text-only authorized retry command. |\n\n### Plugin and packaging\n\n- Bumps the repository/plugin from v2.11.0 to v2.11.1 for the compatible publication-recovery transport improvement.\n\n### Migration or compatibility\n\n- Existing publication requests and policies remain valid. Retry is additive and never accepts release identity overrides.\n\n'''
          if '## v2.11.1 (2026-09-12)' not in nt:
              if marker not in nt:
                  raise SystemExit('release notes marker not found')
              nt = nt.replace(marker, marker + release, 1)
          notes.write_text(nt, encoding='utf-8')
          PY

          python skills/meta/coferlandia-ci-adapter/tests/test_publication_no_gh.py
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py render-readme --write

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/meta/coferlandia-ci-adapter .claude-plugin/plugin.json RELEASE-NOTES.md README.md
          git commit -m "fix(release): add immutable publication retry (#66)"
          git push origin HEAD:fix/66-release-publication-retry
