name: Apply The Architect Cross-Skill Integration

on:
  push:
    branches:
      - agent/the-architect-cross-skill-integration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[integration-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic integration patch
        run: python .github/scripts/apply_the_architect_integration.py

      - name: Validate patched contracts
        run: |
          python -m unittest discover -s skills/engineering/the-architect/tests -p "test_*.py"
          python skills/ops/coferlandia-project-manager/tests/test_workflow_contract.py
          python -m unittest discover -s skills/ops/project-orchestrator/tests -p "test_*.py"
          python _protocol/scripts/validate_skill.py --all skills
          python _protocol/scripts/bump_version.py --check
          python _protocol/scripts/bump_version.py --audit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: integrate the-architect across skills [integration-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
