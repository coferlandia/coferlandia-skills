name: Apply Chat Coder derived-artifact contract

on:
  push:
    branches:
      - fix/chat-coder-derived-artifacts

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical prompt and release changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "prompts/chat-coder.md",
              'version: "1.0.2"',
              'version: "1.0.3"',
          )

          replace_once(
              "prompts/chat-coder.md",
              "Immediately before the terminal development review and handoff, discover and run every applicable cheap deterministic development check owned by the repository on the exact candidate that will be handed off. At minimum:\n\n- synchronize any repository-owned test inventory or generated test manifest affected by added, removed, or renamed tests;",
              "Immediately before the terminal development review and handoff, discover and run every applicable cheap deterministic development check owned by the repository on the exact candidate that will be handed off. Before those checks, identify repository-owned versioned derived artifacts whose authoritative inputs changed and synchronize them with the repository-owned generation or synchronization mechanism rather than editing generated output by hand. At minimum:\n\n- synchronize every applicable repository-owned versioned derived artifact affected by changed inputs, such as generated API/schema clients, schemas, snapshots, inventories/manifests, and equivalent code-generation outputs; when the repository defines a deterministic freshness, idempotence, or diff check, rerun it and require no unexpected diff after the expected outputs are part of the candidate;\n- synchronize any repository-owned test inventory or generated test manifest affected by added, removed, or renamed tests;",
          )

          replace_once(
              "prompts/chat-coder.md",
              "Do not emit `READY_FOR_CI` while an applicable required development check is failing, skipped, unknown, stale, or was run against an older candidate SHA. If a required check cannot be executed in the current environment, report a development blocker instead of representing the candidate as ready.",
              "Do not emit `READY_FOR_CI` while an applicable required development check is failing, skipped, unknown, stale, or was run against an older candidate SHA. A required versioned derived artifact that is missing, stale, manually approximated instead of produced by the repository-owned mechanism, or would still change under an applicable deterministic generation/freshness check is also a development blocker. If a required check or required artifact synchronization cannot be executed in the current environment, report a development blocker instead of representing the candidate as ready.",
          )

          replace_once(
              "_protocol/delivery/READY_FOR_CI.md",
              "- development validation evidence was produced against that exact Candidate SHA;\n- every applicable cheap deterministic development check required by repository-owned instructions, scripts, package metadata, CI profile, or executable workflow is fresh and passing;",
              "- development validation evidence was produced against that exact Candidate SHA;\n- every applicable repository-owned versioned derived artifact affected by the candidate is synchronized through the repository-owned generation/synchronization mechanism, and any repository-defined deterministic freshness/idempotence/diff check for it is passing without unexpected diff;\n- every applicable cheap deterministic development check required by repository-owned instructions, scripts, package metadata, CI profile, or executable workflow is fresh and passing;",
          )

          test_anchor = '''    def test_bootstrap_is_small(self):\n'''
          test_block = '''    def test_chat_coder_ready_for_ci_requires_versioned_derived_artifacts(self):\n        text = (PROMPTS / "chat-coder.md").read_text(encoding="utf-8")\n        ready = (ROOT / "_protocol" / "delivery" / "READY_FOR_CI.md").read_text(encoding="utf-8")\n        self.assertIn("repository-owned versioned derived artifact", text)\n        self.assertIn("repository-owned generation or synchronization mechanism", text)\n        self.assertIn("no unexpected diff", text)\n        self.assertIn("missing, stale, manually approximated", text)\n        self.assertIn("repository-owned versioned derived artifact", ready)\n        self.assertIn("freshness/idempotence/diff check", ready)\n        self.assertIn("without unexpected diff", ready)\n\n'''
          replace_once("prompts/tests/test_contracts.py", test_anchor, test_block + test_anchor)

          replace_once(
              ".claude-plugin/plugin.json",
              '"version": "2.6.3"',
              '"version": "2.6.4"',
          )

          replace_once(
              "README.md",
              "**v2.6.3 — 2026-09-09**",
              "**v2.6.4 — 2026-09-09**",
          )

          release = '''## v2.6.4 (2026-09-09)\n\n### Chat prompts\n\n- `chat-coder` 1.0.2 -> 1.0.3 requires Development to identify and synchronize repository-owned versioned derived artifacts whenever their authoritative inputs change, using the repository's own generation or synchronization mechanism rather than hand-editing generated output.\n- The generic rule covers generated API/schema clients, schemas, snapshots, inventories/manifests, and equivalent code-generation outputs without hardcoding any consumer repository or technology.\n- When a repository defines a deterministic freshness, idempotence, or diff check for generated artifacts, that check must pass without unexpected diff before `READY_FOR_CI`; missing, stale, or manually approximated required artifacts block the handoff.\n\n### Repository and protocol\n\n- Tightens `READY_FOR_CI v1` so affected versioned derived artifacts must be synchronized on the exact source candidate through repository-owned tooling, alongside the existing complete cheap-development validation contract.\n- Adds regression coverage that preserves this requirement while keeping Qualification of the effective/synthetic merge candidate separate.\n\n### Plugin and packaging\n\n- Bumps the installable plugin from v2.6.3 to v2.6.4 because the shipped Chat Coder and shared delivery protocol changed.\n\n### Migration or compatibility\n\n- Existing consumers remain compatible but should update vendored/installed Chat Coder and `READY_FOR_CI` copies together. Repository-specific generators and artifact paths remain repository-owned configuration, not generic prompt policy.\n- Qualification strategy and `READY_FOR_MERGE` semantics are unchanged.\n\n'''
          replace_once(
              "RELEASE-NOTES.md",
              "## Unreleased\n\n",
              "## Unreleased\n\n" + release,
          )
          PY

          python -m unittest prompts.tests.test_contracts
          python _protocol/scripts/validate_prompt.py validate --root . --json
          git diff --check

          git config user.name "Coferlandia Coding Agent"
          git config user.email "actions@users.noreply.github.com"
          git add prompts/chat-coder.md prompts/tests/test_contracts.py _protocol/delivery/READY_FOR_CI.md .claude-plugin/plugin.json README.md RELEASE-NOTES.md
          git commit -m "fix(prompts): require derived artifact synchronization before READY_FOR_CI"
          git push origin HEAD:fix/chat-coder-derived-artifacts
