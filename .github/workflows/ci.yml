name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install orchestration test dependency
        run: python -m pip install jsonschema

      - name: Archivist GitHub-native migration tests
        run: python -m unittest skills.content.project-documentation-archivist.tests.test_github_native_migration

      - name: Project Manager GitHub-native reporting tests
        run: python -m unittest skills.ops.coferlandia-project-manager.tests.test_github_native_reporting

      - name: Project Manager workflow contract tests
        run: python skills/ops/coferlandia-project-manager/tests/test_workflow_contract.py

      - name: The Architect activation, contract, and CLI tests
        run: python -m unittest discover -s skills/engineering/the-architect/tests -p "test_*.py"

      - name: Project Orchestrator v2 tests
        run: python -m unittest discover -s skills/ops/project-orchestrator/tests -p "test_*.py"

      - name: Release maintainer activation and CLI tests
        run: python -m unittest discover -s .agents/skills/coferlandia-release-maintainer/tests -p "test_*.py"

      - name: Validate all public skills
        run: python _protocol/scripts/validate_skill.py --all skills

      - name: Validate repository-local release skill
        run: python _protocol/scripts/validate_skill.py .agents/skills/coferlandia-release-maintainer

      - name: Check repository version drift
        run: python _protocol/scripts/bump_version.py --check

      - name: Audit repository version declarations
        run: python _protocol/scripts/bump_version.py --audit

      - name: Resolve release comparison base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          echo "RELEASE_BASE=$base" >> "$GITHUB_ENV"

      - name: Enforce final-delivery release readiness
        shell: bash
        run: >-
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py
          check --base "$RELEASE_BASE" --release-ready

      - name: Build and verify plugin package
        shell: bash
        run: >-
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py
          package --output "${{ runner.temp }}/coferlandia-skills.plugin" --verify
