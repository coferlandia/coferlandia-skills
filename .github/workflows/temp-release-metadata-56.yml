name: Temporary release metadata 56

on:
  push:
    branches:
      - fix/56-release-workflow-no-gh

permissions:
  contents: write

jobs:
  metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/56-release-workflow-no-gh
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update patch release metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('skills/meta/coferlandia-ci-adapter/SKILL.md', 'version: "1.2.0"', 'version: "1.2.1"')
          replace('skills/ops/coferlandia-release-publisher/SKILL.md', 'version: "1.1.1"', 'version: "1.1.2"')

          entries = {
              'skills/meta/coferlandia-ci-adapter/CHANGELOG.md': '## 1.2.1 — 2026-09-12\n\n### Fixed\n\n- Generated GitHub-native publication workflows no longer require a preinstalled GitHub CLI; authority and merged-PR identity checks use Python standard-library GitHub REST calls.\n- Preserves explicit runner selection, exact merge-SHA binding, minimal permissions, fail-closed behavior, and no deployment semantics.\n\n',
              'skills/ops/coferlandia-release-publisher/CHANGELOG.md': '## 1.1.2 — 2026-09-12\n\n### Fixed\n\n- Replaces the publisher runtime dependency on GitHub CLI with Python standard-library GitHub REST transport using `GITHUB_TOKEN` or `GH_TOKEN`.\n- Preserves annotated-tag, draft Release, asset verification, publication, and fail-closed semantics.\n\n',
          }
          for path, entry in entries.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if entry.splitlines()[0] not in text:
                  first = text.find('\n') + 1 if text.startswith('# ') else 0
                  text = text[:first] + '\n' + entry + text[first:].lstrip('\n')
                  p.write_text(text, encoding='utf-8')

          plugin = Path('.claude-plugin/plugin.json')
          data = json.loads(plugin.read_text(encoding='utf-8'))
          data['version'] = '2.10.1'
          plugin.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json skills/meta/coferlandia-ci-adapter/SKILL.md skills/meta/coferlandia-ci-adapter/CHANGELOG.md skills/ops/coferlandia-release-publisher/SKILL.md skills/ops/coferlandia-release-publisher/CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(release): prepare 2.10.1 metadata (#56)"
          git push origin HEAD:fix/56-release-workflow-no-gh
