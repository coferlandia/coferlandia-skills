name: Temporary prepare merge close release

on:
  push:
    branches:
      - fix/merge-close-work-item

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'coferlandia/coferlandia-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/merge-close-work-item
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare v2.10.2 metadata and remove temporary workflow
        shell: bash
        run: |
          cat > .release-plan.tmp.json <<'JSON'
          {
            "schema_version": 1,
            "release_version": "2.10.2",
            "release_date": "2026-09-12",
            "impact": "patch",
            "skills": [],
            "repository_changes": [
              "`merge` 1.1.0 -> 1.1.1 makes associated Issue/work-item closure an explicit required Integration side effect after verified integration into the authoritative target ref, including approved non-default integration branches.",
              "Adds `CLOSEOUT_BLOCKED` when post-integration work-item closure cannot be performed or verified, while keeping GitHub Project Done projection separate and optional.",
              "Adds regression coverage and catalog/guide documentation for explicit Integration closeout semantics."
            ],
            "plugin_changes": [
              "Bumps the shipped repository/plugin from v2.10.1 to v2.10.2 as a compatible Integration closeout correction.",
              "No public Agent Skill versions change in this release."
            ],
            "migration_notes": [
              "Existing consumers remain compatible. Repositories vendoring Chat delivery prompts should update `merge.md` so Integration explicitly closes the associated work item instead of depending on GitHub default-branch closing-keyword behavior.",
              "Repository-owned authoritative target-ref policy remains unchanged; no branch name or GitHub Project identifier is hardcoded."
            ]
          }
          JSON
          python .agents/skills/coferlandia-release-maintainer/scripts/coferlandia-release-maintainer-cli.py prepare --input .release-plan.tmp.json
          rm .release-plan.tmp.json
          git rm .github/workflows/prepare-merge-close-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json RELEASE-NOTES.md README.md
          git commit -m "chore(release): prepare Coferlandia 2.10.2"
          git push origin HEAD:fix/merge-close-work-item
