name: Apply Epic 24 final correction

on:
  push:
    branches: [epic-24-config-tooling]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: epic-24-config-tooling

      - name: Detect correction trigger
        id: trigger
        shell: bash
        run: |
          if [[ -f .agent/epic24-final-fix.trigger ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed correction
        if: steps.trigger.outputs.present == 'true'
        shell: python
        run: |
          from pathlib import Path

          template = Path('skills/meta/coferlandia-config-toolsmith/templates/python-config-cli.py.tmpl')
          text = template.read_text(encoding='utf-8')
          duplicate = 'def parse_assignments(items):\n    result = []\n    result = []\n'
          if duplicate not in text:
              raise SystemExit('parse_assignments correction anchor missing')
          text = text.replace(duplicate, 'def parse_assignments(items):\n    result = []\n', 1)
          setup = '        if args.command == "setup":\n            return interactive_wizard(root, contract, quick=args.quick)\n'
          replacement = '''        if args.command == "setup":
            if args.quick and args.reconfigure:
                raise ValueError("--quick and --reconfigure cannot be combined")
            return interactive_wizard(root, contract, quick=not args.reconfigure)
'''
          if setup not in text:
              raise SystemExit('setup correction anchor missing')
          text = text.replace(setup, replacement, 1)
          template.write_text(text, encoding='utf-8')

          tests = Path('skills/meta/coferlandia-config-toolsmith/tests/test_cli.py')
          tests_text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_contract_path_cannot_escape_target_root(self):
'''
          test = '''    def test_setup_defaults_to_minimal_and_reconfigure_expands_scope(self):
        contract = load_data(FIXTURES / "valid-contract.yaml")
        with tempfile.TemporaryDirectory() as td:
            root = Path(td)
            self.make_project(root)
            generate_facade(contract, root, "python", dry_run=False)
            source = (root / "scripts/sample-config-cli.py").read_text(encoding="utf-8")
            self.assertIn("quick=not args.reconfigure", source)
            self.assertIn("--quick and --reconfigure cannot be combined", source)

'''
          if 'test_setup_defaults_to_minimal_and_reconfigure_expands_scope' not in tests_text:
              if anchor not in tests_text:
                  raise SystemExit('test insertion anchor missing')
              tests_text = tests_text.replace(anchor, test + anchor, 1)
          tests.write_text(tests_text, encoding='utf-8')

          changelog = Path('skills/meta/coferlandia-config-toolsmith/CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          changelog_anchor = '- Generates interactive setup/config wizards plus deterministic machine-readable commands for agents and CI.\n'
          changelog_line = '- Defaults `setup` to minimal fields and reserves `setup --reconfigure` for the complete writable surface.\n'
          if changelog_line not in changelog_text:
              if changelog_anchor not in changelog_text:
                  raise SystemExit('changelog insertion anchor missing')
              changelog_text = changelog_text.replace(changelog_anchor, changelog_anchor + changelog_line, 1)
          changelog.write_text(changelog_text, encoding='utf-8')

      - name: Remove trigger and validate
        if: steps.trigger.outputs.present == 'true'
        shell: bash
        run: |
          rm -f .agent/epic24-final-fix.trigger
          rmdir .agent 2>/dev/null || true
          python -m unittest discover -s skills/meta/coferlandia-config-toolsmith/tests -p 'test_*.py'
          python -m unittest discover -s skills/ops/coferlandia-config-devops/tests -p 'test_*.py'
          python _protocol/scripts/validate_skill.py skills/meta/coferlandia-config-toolsmith
          python _protocol/scripts/validate_skill.py skills/ops/coferlandia-config-devops

      - name: Commit correction
        if: steps.trigger.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'coferlandia-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- ':!/.github/workflows'
          git commit -m 'fix: keep setup wizard minimal by default'
          git push origin HEAD:epic-24-config-tooling
